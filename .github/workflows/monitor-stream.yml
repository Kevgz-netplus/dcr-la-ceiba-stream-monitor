name: Monitor DCR La Ceiba Stream

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run monitor
        env:
          STREAM_URL: ${{ secrets.STREAM_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_TOPIC: radio_status
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node monitor.js

      # Runs even when the monitor step failed. A failed FCM call still leaves a
      # real observation on disk, and state.json now records separately what was
      # seen and what was announced, so committing it keeps the files honest
      # without losing the notification: the next run sees the two disagree and
      # tries again.
      - name: Commit state files if changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json stream-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json stream-status.json
            git commit -m "Update stream status"
            git push
          else
            echo "No state changes to commit."
          fi
